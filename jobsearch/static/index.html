<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobsearch</title>
<link rel="stylesheet" href="/static/app.css">
<style>
#count{color:var(--muted);font-size:13px;margin-left:auto}
main{padding:18px 20px;max-width:1000px;margin:0 auto;
  display:flex;flex-direction:column;gap:12px}
.card.new{border-left:3px solid var(--accent)}
.top{display:flex;gap:12px;align-items:flex-start}
.score{flex:0 0 46px;height:46px;border-radius:9px;display:grid;place-items:center;
  font-weight:700;font-size:17px;background:var(--line)}
.s-hi{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.s-mid{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.s-lo{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.title{font-weight:650;font-size:15.5px}
.title .tlink{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.title .tlink:hover{border-bottom-color:currentColor}
.p-links{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.verdict{margin:10px 0 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag.concern{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.dims{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tech{font-size:11.5px;padding:1px 7px;border-radius:5px;font-weight:600;
  border:1px solid var(--line);color:var(--muted)}
.tech.t-expert{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent);
  background:color-mix(in srgb,var(--good) 12%,transparent)}
.tech.t-strong{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tech.t-familiar{color:var(--muted)}
.tech.t-none{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);
  border-style:dashed}
.techrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.techrow .lbl{font-size:11px;color:var(--muted);opacity:.75}
.lang,.exp{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap}
.lang.gap{color:var(--warn);font-weight:650;
  border-color:color-mix(in srgb,var(--warn) 55%,transparent);
  background:color-mix(in srgb,var(--warn) 12%,transparent)}
.lang.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.p-note{padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.p-note textarea{width:100%;background:var(--card);color:var(--ink);font:inherit;
  font-size:13px;border:1px solid var(--line);border-radius:7px;padding:8px;resize:vertical;
  min-height:56px}
.p-note .row{display:flex;gap:8px;align-items:center;margin-top:7px}
.p-note .hint{font-size:11.5px;color:var(--muted);flex:1}
.applied{font-size:11.5px;color:var(--muted);border-left:2px solid var(--line);
  padding-left:8px;margin-bottom:12px;font-style:italic}
.cmd{font-family:ui-monospace,monospace;font-size:12px;background:var(--bg);
  border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:inline-block}
.draft .block{margin-top:10px}
.blk-h{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
.cp{font-size:11px;padding:1px 7px}
.dim[title]{cursor:help}
.dim.has-note{border-style:solid;box-shadow:inset 0 -2px 0 0 color-mix(in srgb,currentColor 35%,transparent)}
.dim.d-hi{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);
  background:color-mix(in srgb,var(--good) 10%,transparent)}
.dim.d-mid{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,transparent)}
.dim.d-lo{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.salary{font-size:12.5px;padding:2px 9px;border-radius:99px;font-weight:600;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.salary.stated{color:var(--good);font-weight:700;
  border-color:color-mix(in srgb,var(--good) 50%,transparent);
  background:color-mix(in srgb,var(--good) 14%,transparent)}
.age{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap}
.age.fresh{color:var(--accent);font-weight:650;
  border-color:color-mix(in srgb,var(--accent) 50%,transparent);
  background:color-mix(in srgb,var(--accent) 12%,transparent)}
.age.stale{opacity:.6}
.penalty{font-size:11.5px;color:var(--bad);font-weight:700;margin-top:3px;text-align:center}
.src{font-size:11.5px;padding:1px 7px;border-radius:5px;text-decoration:none;
  border:1px solid var(--line);color:var(--muted)}
.src:hover{border-color:var(--accent);color:var(--accent)}
.src.djinni{color:#2563eb;border-color:color-mix(in srgb,#2563eb 40%,transparent)}
.src.dou{color:#0891b2;border-color:color-mix(in srgb,#0891b2 40%,transparent)}
.src.remoteok{color:#7c3aed;border-color:color-mix(in srgb,#7c3aed 40%,transparent)}
.src.weworkremotely{color:#c2410c;border-color:color-mix(in srgb,#c2410c 40%,transparent)}
.src.linkedin{color:#0a66c2;border-color:color-mix(in srgb,#0a66c2 40%,transparent)}
.dup{font-size:11.5px;padding:1px 7px;border-radius:5px;color:var(--warn);
  border:1px dashed color-mix(in srgb,var(--warn) 55%,transparent)}
.headline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:5px}
.card.sel{outline:2px solid var(--accent);outline-offset:2px}
.today{margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.01em}
kbd{font:inherit;font-size:11px;padding:1px 5px;border:1px solid var(--line);
  border-radius:4px;color:var(--muted)}
.dim{font-size:11.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px}
.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
pre.desc{white-space:pre-wrap;font:inherit;color:var(--muted);margin:8px 0 0;
  max-height:340px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>jobsearch</h1>
  <div class="controls">
    <input type="search" id="q" placeholder="search title, company, description">
    <select id="minScore">
      <option value="7">score ≥ 7</option>
      <option value="8">score ≥ 8</option>
      <option value="6">score ≥ 6</option>
      <option value="">any score</option>
    </select>
    <select id="src"><option value="">all sources</option></select>
    <select id="arr">
      <option value="">any arrangement</option>
      <option value="remote">remote</option>
      <option value="hybrid">hybrid</option>
      <option value="unknown">unspecified</option>
    </select>
    <select id="status">
      <option value="untriaged">untriaged</option>
      <option value="interested">interested</option>
      <option value="applied">applied</option>
      <option value="skipped">skipped</option>
      <option value="all">all statuses</option>
    </select>
    <span id="count"></span>
    <span style="font-size:12px;color:var(--muted)"><kbd>j</kbd><kbd>k</kbd> move
      <kbd>i</kbd>nterested <kbd>a</kbd>pplied <kbd>s</kbd>kip <kbd>o</kbd>pen <kbd>d</kbd>raft</span>
    <a class="nav" href="/applications">applications →</a>
  </div>
  <div class="today" id="today"></div>
</header>
<main id="list"></main>
<div id="backdrop"></div>
<aside id="panel" aria-hidden="true">
  <div class="p-head">
    <div class="t" id="p-title"></div>
    <div class="p-links" id="p-links"></div>
    <button id="p-close" title="Escape">close</button>
  </div>
  <div class="p-body" id="p-body"></div>
  <div class="p-note">
    <textarea id="p-prompt" placeholder="Change something — e.g. shorter, lead with the KYC work, less formal"></textarea>
    <div class="row">
      <button id="p-refresh">save instruction</button>
      <span class="hint" id="p-hint"></span>
    </div>
  </div>
</aside>
<script src="/static/util.js"></script>
<script>
let JOBS = [];
let SHOWN = [];
let sel = 0;

async function load() {
  const p = new URLSearchParams();
  if ($("#minScore").value) p.set("min_score", $("#minScore").value);
  p.set("status", $("#status").value);
  JOBS = await (await fetch("/api/jobs?" + p)).json();
  loadStats();

  const sources = [...new Set(JOBS.flatMap(j => j.sources.map(s => s.name)))].sort();
  const keep = $("#src").value;
  $("#src").innerHTML = '<option value="">all sources</option>' +
    sources.map(s => `<option ${s === keep ? "selected" : ""}>${esc(s)}</option>`).join("");
  render();
}

function render() {
  const q = $("#q").value.toLowerCase().trim();
  const src = $("#src").value, arr = $("#arr").value;
  const shown = JOBS.filter(j =>
    (!src || j.sources.some(s => s.name === src)) &&
    (!arr || j.arrangement === arr) &&
    (!q || (j.title + " " + j.company + " " + j.description).toLowerCase().includes(q)));

  SHOWN = shown;
  $("#count").textContent = `${shown.length} of ${JOBS.length}`;
  $("#list").innerHTML = shown.length ? shown.map(card).join("")
    : '<div class="empty">Nothing here. Run <code>/harvest</code>, then reload.</div>';
  if (sel >= shown.length) sel = Math.max(0, shown.length - 1);
  const cards = $("#list").querySelectorAll("article.card");
  cards.forEach((c, i) => c.classList.toggle("sel", i === sel && shown.length > 0));
  $("#list").querySelectorAll("button.open-draft").forEach(b =>
    b.addEventListener("click", () => openPanel(Number(b.dataset.job))));
  $("#list").querySelectorAll("button.cp").forEach(b =>
    b.addEventListener("click", () => {
      navigator.clipboard?.writeText(b.dataset.copy);
      b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200);
    }));
  $("#list").querySelectorAll("button[data-id]").forEach(b =>
    b.addEventListener("click", () => mark(Number(b.dataset.id), b.dataset.status)));
  $("#list").querySelectorAll("button.track").forEach(b =>
    b.addEventListener("click", () => trackApplication(Number(b.dataset.track), b)));
}

function card(j) {
  const cls = j.score >= 8 ? "s-hi" : j.score >= 6 ? "s-mid" : "s-lo";
  const dimCls = v => Number(v) >= 8 ? "d-hi" : Number(v) >= 6 ? "d-mid" : Number(v) <= 3 ? "d-lo" : "";
  const dims = (j.dimension_detail || []).length
    ? j.dimension_detail.map(d => {
        const label = d.name.replace(/_fit|_potential/, "").replace(/_/g, " ");
        // Tooltip answers two different questions: what the scorer thought (note),
        // and how much this number actually moved the total (weight/contribution).
        // The arithmetic is always available; the reasoning only when it was recorded.
        const arith = `weight ${d.weight}% · contributed ${d.contribution.toFixed(1)} pts`;
        const tip = d.note ? `${d.note}\n\n${arith}` : arith;
        return `<span class="dim ${dimCls(d.value)} ${d.note ? "has-note" : ""}" title="${esc(tip)}">${esc(label)} ${esc(d.value)}</span>`;
      }).join("")
    : Object.entries(j.dimensions || {})
        .map(([k, v]) => `<span class="dim ${dimCls(v)}">${esc(k.replace(/_fit|_potential/, "").replace(/_/g, " "))} ${esc(v)}</span>`).join("");
  const tech = (j.tech || [])
    .map(t => `<span class="tech t-${t.tier || "none"}" title="${t.tier ? esc("your " + t.tier + " tier") : "not in your profile"}">${esc(t.name)}</span>`)
    .join("");
  const concerns = (j.hard_concerns || [])
    .map(c => `<span class="tag concern">${esc(c)}</span>`).join("");
  const links = j.sources
    .map(s => `<a class="src ${esc(s.name)}" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.name)}</a>`)
    .join("");
  return `<article class="card ${j.is_new ? "new" : ""}">
    <div class="top">
      <div>
        <div class="score ${cls}">${j.score ?? "–"}</div>
        ${j.red_flag_penalty > 0 ? `<div class="penalty" title="Red-flag penalty subtracted from the weighted score">−${esc(j.red_flag_penalty)}</div>` : ""}
      </div>
      <div style="flex:1">
        <div class="title"><a class="tlink" href="${esc(safeUrl(j.sources[0]?.url))}" target="_blank" rel="noopener" title="Open the posting on ${esc(j.sources[0]?.name || "the board")}">${esc(j.title)}</a> — ${esc(j.company)}</div>
        <div class="headline">
          <span class="salary ${j.salary.stated ? "stated" : ""}">${esc(j.salary.text)}</span>
          <span class="age ${ageCls(j.first_seen_at)}">${esc(age(j.first_seen_at))}</span>
          ${links}
          ${j.language ? `<span class="lang ${j.language.gap ? "gap" : "ok"}" title="${j.language.gap ? "above the level in your profile" : "within your profile"}">${esc(j.language.text)}</span>` : ""}
          ${j.experience_hint ? `<span class="exp">${esc(j.experience_hint)}</span>` : ""}
          ${j.is_duplicate ? `<span class="dup" title="Same fingerprint as another card — the merge gate refused it. Apply once.">duplicate</span>` : ""}
        </div>
        <div class="meta">${esc(j.location || j.arrangement)} · ${esc(j.employment_type)}
          ${j.status ? ` · <b>${esc(j.status)}</b>` : ""}</div>
      </div>
    </div>
    ${j.verdict ? `<p class="verdict">${esc(j.verdict)}</p>` : ""}
    ${concerns ? `<div class="tags">${concerns}</div>` : ""}
    ${tech ? `<div class="techrow"><span class="lbl">stack</span>${tech}</div>` : ""}
    ${dims ? `<div class="dims">${dims}</div>` : ""}
    ${(j.strengths || []).length || (j.weaknesses || []).length ? `<div class="tags">
      ${(j.strengths || []).map(s => `<span class="tag">+ ${esc(s)}</span>`).join("")}
      ${(j.weaknesses || []).map(w => `<span class="tag">− ${esc(w)}</span>`).join("")}
    </div>` : ""}
    <details><summary>description</summary><pre class="desc">${esc(j.description)}</pre></details>
    <div class="actions">
      <button data-id="${j.id}" data-status="interested">Interested</button>
      <button data-id="${j.id}" data-status="applied">Applied</button>
      <button data-id="${j.id}" data-status="skipped">Skip</button>
      <button class="open-draft" data-job="${j.id}">${j.draft ? "application ▸" : "draft…"}</button>
      <button class="track" data-track="${j.id}">track application</button>
    </div>
  </article>`;
}

// Prefills the application with the cover letter and "why fit" text already
// written for this job — the spec's "prefill from draft" — so tracking a job
// that was drafted for doesn't start the application from a blank page.
async function trackApplication(jobId, btn) {
  const job = JOBS.find(j => j.id === jobId);
  const draft = job && job.draft;
  btn.disabled = true;
  btn.textContent = "tracking…";
  try {
    await postJSON("/api/applications", {
      job_id: jobId,
      cover_letter: draft?.cover_letter || undefined,
      why_company: draft?.why_fit || undefined,
    });
    btn.textContent = "tracked ✓";
  } catch (err) {
    const already = /already tracked/i.test(err.message);
    btn.textContent = already ? "already tracked" : "failed — " + err.message;
    btn.disabled = already;
  }
}

async function mark(id, status) {
  const res = await fetch("/api/status", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id, status}),
  });
  if (!res.ok) { alert("Failed: " + (await res.json()).error); return; }
  // Keep the card only when it still belongs under the active filter, so
  // "untriaged" keeps draining as you triage while "applied" fills up instead.
  const view = $("#status").value;
  if (view === "all" || view === status) {
    JOBS.find(j => j.id === id).status = status;
    render();
  } else {
    JOBS = JOBS.filter(j => j.id !== id);
    render();
  }
  loadStats();
}

async function loadStats() {
  try {
    const s = await (await fetch("/api/stats")).json();
    if (s.error) return;
    $("#today").textContent =
      `today · ${s.fetched} fetched · ${s.new} new · ${s.scored} scored · ` +
      `${s.above} above ${s.threshold} · ${s.triaged} triaged`;
  } catch { /* the strip is informational — never let it break the page */ }
}

let panelJob = null;

function renderPanel(j) {
  panelJob = j || null;
  if (!j) return;
  $("#p-title").textContent = `${j.title} — ${j.company}`;
  // Every board carrying this job, so an application can be sent from whichever
  // one the owner prefers — and so a dead link on one source is not a dead end.
  $("#p-links").innerHTML = (j.sources || [])
    .map(s => `<a class="src ${esc(s.name)}" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">open on ${esc(s.name)} &#8599;</a>`)
    .join("");
  const d = j.draft;
  $("#p-body").innerHTML = d
    ? (d.stale ? `<div class="applied">Written before your profile changed — worth regenerating.</div>` : "")
      + (d.applied_note ? `<div class="applied">written with: “${esc(d.applied_note)}”</div>` : "")
      + ["cover_letter", "email", "why_fit"].map(k => `<div class="block">
          <div class="blk-h">${esc(k.replace(/_/g, " "))}<button class="cp" data-copy="${esc(d[k])}">copy</button></div>
          <pre class="desc">${esc(d[k])}</pre></div>`).join("")
    : `<p style="color:var(--muted)">No draft yet. Run this in Claude Code:</p>
       <p><span class="cmd">/draft ${j.id}</span></p>
       <p style="color:var(--muted);font-size:13px">You can leave an instruction below first —
       the run will follow it.</p>`;
  $("#p-prompt").value = j.pending_note || "";
  $("#p-hint").textContent = j.pending_note
    ? `saved — run /draft ${j.id} to apply it` : "";
  $("#p-body").querySelectorAll("button.cp").forEach(b =>
    b.addEventListener("click", () => {
      navigator.clipboard?.writeText(b.dataset.copy);
      b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200);
    }));
}

function openPanel(id) {
  const j = SHOWN.find(x => x.id === id) || JOBS.find(x => x.id === id);
  if (!j) return;
  renderPanel(j);
  $("#panel").classList.add("open");
  $("#panel").setAttribute("aria-hidden", "false");
  $("#backdrop").classList.add("on");
}

function closePanel() {
  $("#panel").classList.remove("open");
  $("#panel").setAttribute("aria-hidden", "true");
  $("#backdrop").classList.remove("on");
  panelJob = null;
}

$("#p-close").addEventListener("click", closePanel);
$("#backdrop").addEventListener("click", closePanel);

$("#p-refresh").addEventListener("click", async () => {
  if (!panelJob) return;
  const note = $("#p-prompt").value;
  const res = await fetch("/api/draft-note", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: panelJob.id, note}),
  });
  if (!res.ok) { $("#p-hint").textContent = "failed: " + (await res.json()).error; return; }
  // Keep the local copy in step so reopening the panel before the next load
  // shows what was actually saved rather than a stale blank.
  panelJob.pending_note = note.trim() || null;
  $("#p-hint").textContent = panelJob.pending_note
    ? `saved — run /draft ${panelJob.id} to apply it` : "cleared";
});

function moveSel(delta) {
  if (!SHOWN.length) return;
  sel = Math.min(SHOWN.length - 1, Math.max(0, sel + delta));
  const cards = $("#list").querySelectorAll("article.card");
  cards.forEach((c, i) => c.classList.toggle("sel", i === sel));
  cards[sel]?.scrollIntoView({block: "nearest", behavior: "smooth"});
  // The panel follows the selection rather than pinning to one job, so j/k
  // walks the queue with the drafts open.
  if ($("#panel").classList.contains("open")) renderPanel(SHOWN[sel]);
}

document.addEventListener("keydown", e => {
  // Never hijack typing in the search box or a select.
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const job = SHOWN[sel];
  const acts = {i: "interested", a: "applied", s: "skipped"};
  if (e.key === "Escape") { closePanel(); return; }
  if (e.key === "d" && job) { e.preventDefault(); openPanel(job.id); return; }
  if (e.key === "j") { e.preventDefault(); moveSel(1); }
  else if (e.key === "k") { e.preventDefault(); moveSel(-1); }
  else if (e.key === "o" && job) { e.preventDefault(); window.open(job.sources[0]?.url, "_blank", "noopener"); }
  else if (acts[e.key] && job) { e.preventDefault(); mark(job.id, acts[e.key]); }
});

["#q", "#src", "#arr"].forEach(s => $(s).addEventListener("input", render));
["#minScore", "#status"].forEach(s => $(s).addEventListener("change", load));
load();
</script>
</body>
</html>
